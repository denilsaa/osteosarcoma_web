services:

  # =========================================================
  # BASE DE DATOS - USUARIOS
  # =========================================================
  postgres_usuarios:
    image: postgres:17
    container_name: osteosarcoma_postgres_usuarios
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_USUARIOS_DB}
      POSTGRES_USER: ${POSTGRES_USUARIOS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USUARIOS_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data
      - ./servicios/servicio_usuarios/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USUARIOS_USER} -d ${POSTGRES_USUARIOS_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - osteosarcoma_network


  # =========================================================
  # SERVICIO - USUARIOS
  # =========================================================
  servicio_usuarios:
    build:
      context: ./servicios/servicio_usuarios
      dockerfile: Dockerfile

    container_name: osteosarcoma_servicio_usuarios
    restart: unless-stopped

    environment:
      DJANGO_SECRET_KEY: ${USUARIOS_DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${USUARIOS_DJANGO_DEBUG}

      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}

      EMAIL_BACKEND: ${USUARIOS_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${USUARIOS_EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${USUARIOS_EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${USUARIOS_EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${USUARIOS_EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${USUARIOS_EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${USUARIOS_EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${USUARIOS_DEFAULT_FROM_EMAIL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      RECOVERY_LINK_MINUTES: ${RECOVERY_LINK_MINUTES:-15}
      OTP_CODE_MINUTES: ${OTP_CODE_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-60}
      OTP_MAX_RESENDS: ${OTP_MAX_RESENDS:-3}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}

      DB_NAME: ${POSTGRES_USUARIOS_DB}
      DB_USER: ${POSTGRES_USUARIOS_APP_USER}
      DB_PASSWORD: ${POSTGRES_USUARIOS_APP_PASSWORD}
      DB_HOST: postgres_usuarios
      DB_PORT: 5432

    ports:
      - "8000:8000"

    volumes:
      - ./servicios/servicio_usuarios:/app

    depends_on:
      postgres_usuarios:
        condition: service_healthy

    networks:
      - osteosarcoma_network


  # =========================================================
  # BASE DE DATOS - CLINICO
  # =========================================================
  postgres_clinico:
    image: postgres:17
    container_name: osteosarcoma_postgres_clinico
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_CLINICO_DB}
      POSTGRES_USER: ${POSTGRES_CLINICO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CLINICO_PASSWORD}

      # Usuario restringido utilizado por Django
      POSTGRES_APP_USER: ${POSTGRES_CLINICO_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_CLINICO_APP_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_clinico_data:/var/lib/postgresql/data

      # Se ejecuta únicamente al inicializar una BD nueva
      - ./servicios/servicio_clinico/postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_CLINICO_USER} -d ${POSTGRES_CLINICO_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - osteosarcoma_network


  # =========================================================
  # SERVICIO - CLINICO
  # =========================================================
  servicio_clinico:
    build:
      context: ./servicios/servicio_clinico
      dockerfile: Dockerfile

    container_name: osteosarcoma_servicio_clinico
    restart: unless-stopped

    environment:
      DJANGO_SECRET_KEY: ${CLINICO_DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${CLINICO_DJANGO_DEBUG}

      DB_NAME: ${POSTGRES_CLINICO_DB}
      DB_USER: ${POSTGRES_CLINICO_APP_USER}
      DB_PASSWORD: ${POSTGRES_CLINICO_APP_PASSWORD}
      DB_HOST: postgres_clinico
      DB_PORT: 5432

    ports:
      - "8001:8000"

    volumes:
      - ./servicios/servicio_clinico:/app

    depends_on:
      postgres_clinico:
        condition: service_healthy

    networks:
      - osteosarcoma_network


  # =========================================================
  # BASE DE DATOS - IA
  # =========================================================
  postgres_ia:
    image: postgres:17
    container_name: osteosarcoma_postgres_ia
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_IA_DB}
      POSTGRES_USER: ${POSTGRES_IA_USER}
      POSTGRES_PASSWORD: ${POSTGRES_IA_PASSWORD}

      # Usuario restringido utilizado por Django
      POSTGRES_APP_USER: ${POSTGRES_IA_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_IA_APP_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres_ia_data:/var/lib/postgresql/data

      # Se ejecuta únicamente al inicializar una BD nueva
      - ./servicios/servicio_ia/postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_IA_USER} -d ${POSTGRES_IA_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - osteosarcoma_network


  # =========================================================
  # SERVICIO - IA
  # =========================================================
  servicio_ia:
    build:
      context: ./servicios/servicio_ia
      dockerfile: Dockerfile

    container_name: osteosarcoma_servicio_ia
    restart: unless-stopped

    environment:
      DJANGO_SECRET_KEY: ${IA_DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${IA_DJANGO_DEBUG}

      DB_NAME: ${POSTGRES_IA_DB}
      DB_USER: ${POSTGRES_IA_APP_USER}
      DB_PASSWORD: ${POSTGRES_IA_APP_PASSWORD}
      DB_HOST: postgres_ia
      DB_PORT: 5432

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "8002:8000"

    volumes:
      - ./servicios/servicio_ia:/app

    depends_on:
      postgres_ia:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    networks:
      - osteosarcoma_network


  # =========================================================
  # BASE DE DATOS - RADIOGRAFIAS
  # =========================================================
  postgres_radiografias:
    image: postgres:17
    container_name: osteosarcoma_postgres_radiografias
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_RADIOGRAFIAS_DB}
      POSTGRES_USER: ${POSTGRES_RADIOGRAFIAS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_RADIOGRAFIAS_PASSWORD}

      # Usuario restringido utilizado por Laravel
      POSTGRES_APP_USER: ${POSTGRES_RADIOGRAFIAS_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_RADIOGRAFIAS_APP_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - postgres_radiografias_data:/var/lib/postgresql/data

      # Se ejecuta únicamente al inicializar una BD nueva
      - ./servicios/servicio_radiografias/postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_RADIOGRAFIAS_USER} -d ${POSTGRES_RADIOGRAFIAS_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - osteosarcoma_network


  # =========================================================
  # SERVICIO - RADIOGRAFIAS
  # =========================================================
  servicio_radiografias:
    build:
      context: ./servicios/servicio_radiografias
      dockerfile: Dockerfile

    container_name: osteosarcoma_servicio_radiografias
    restart: unless-stopped

    environment:
      APP_ENV: ${RADIOGRAFIAS_APP_ENV}
      APP_DEBUG: ${RADIOGRAFIAS_APP_DEBUG}

      DB_CONNECTION: pgsql
      DB_HOST: postgres_radiografias
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_RADIOGRAFIAS_DB}
      DB_USERNAME: ${POSTGRES_RADIOGRAFIAS_APP_USER}
      DB_PASSWORD: ${POSTGRES_RADIOGRAFIAS_APP_PASSWORD}

    ports:
      - "8003:8000"

    volumes:
      - ./servicios/servicio_radiografias:/app

    depends_on:
      postgres_radiografias:
        condition: service_healthy

    networks:
      - osteosarcoma_network


  # =========================================================
  # BASE DE DATOS - AUDITORIA
  # =========================================================
  postgres_auditoria:
    image: postgres:17
    container_name: osteosarcoma_postgres_auditoria
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_AUDITORIA_DB}
      POSTGRES_USER: ${POSTGRES_AUDITORIA_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUDITORIA_PASSWORD}

      POSTGRES_APP_USER: ${POSTGRES_AUDITORIA_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_AUDITORIA_APP_PASSWORD}

    ports:
      - "5436:5432"

    volumes:
      - postgres_auditoria_data:/var/lib/postgresql/data
      - ./servicios/servicio_auditoria/postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_AUDITORIA_USER} -d ${POSTGRES_AUDITORIA_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - osteosarcoma_network


  # =========================================================
  # SERVICIO - AUDITORIA
  # =========================================================
  servicio_auditoria:
    build:
      context: ./servicios/servicio_auditoria
      dockerfile: Dockerfile

    container_name: osteosarcoma_servicio_auditoria
    restart: unless-stopped

    environment:
      APP_ENV: ${AUDITORIA_APP_ENV}
      APP_DEBUG: ${AUDITORIA_APP_DEBUG}

      DB_CONNECTION: pgsql
      DB_HOST: postgres_auditoria
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_AUDITORIA_DB}
      DB_USERNAME: ${POSTGRES_AUDITORIA_APP_USER}
      DB_PASSWORD: ${POSTGRES_AUDITORIA_APP_PASSWORD}

    ports:
      - "8004:8000"

    volumes:
      - ./servicios/servicio_auditoria:/app

    depends_on:
      postgres_auditoria:
        condition: service_healthy

    networks:
      - osteosarcoma_network


  # =========================================================
  # RABBITMQ
  # =========================================================
  rabbitmq:
    image: rabbitmq:4-management
    container_name: osteosarcoma_rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - osteosarcoma_network


  # =========================================================
  # FRONTEND - REACT
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: osteosarcoma_frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_USUARIOS_URL: http://localhost:8000
      VITE_API_CLINICO_URL: http://localhost:8001
      VITE_API_IA_URL: http://localhost:8002
      VITE_API_RADIOGRAFIAS_URL: http://localhost:8003
      VITE_API_AUDITORIA_URL: http://localhost:8004

    depends_on:
      - servicio_usuarios
      - servicio_clinico
      - servicio_ia
      - servicio_radiografias
      - servicio_auditoria

    networks:
      - osteosarcoma_network


# =========================================================
# VOLUMENES PERSISTENTES
# =========================================================
volumes:

  postgres_usuarios_data:

  postgres_clinico_data:

  postgres_ia_data:

  postgres_radiografias_data:

  postgres_auditoria_data:

  rabbitmq_data:

  frontend_node_modules:


# =========================================================
# RED INTERNA
# =========================================================
networks:

  osteosarcoma_network:
    driver: bridge